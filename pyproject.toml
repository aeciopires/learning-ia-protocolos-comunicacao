# Raiz do workspace uv: um único uv.lock para todos os laboratórios.
[project]
name = "learning-ia-protocolos-comunicacao"
version = "0.1.0"
description = "Laboratórios sobre protocolos de comunicação para sistemas de IA"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.3.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["labs/common", "labs/lab-*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["labs"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["labs/lab-08-sdk-typescript/server"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
