[project]
name = "lab-10-injecao"
version = "0.1.0"
description = "Injeção indireta e dados adulterados, com e sem defesas"
requires-python = ">=3.14"
dependencies = ["labs-common"]

[tool.uv.sources]
labs-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab_10_injection"
