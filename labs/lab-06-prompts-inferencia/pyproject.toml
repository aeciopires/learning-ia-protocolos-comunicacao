[project]
name = "lab-06-prompts-inferencia"
version = "0.1.0"
description = "Prompts parametrizados, inferência direta, sampling legado e limite de recursão"
requires-python = ">=3.14"
dependencies = ["labs-common"]

[tool.uv.sources]
labs-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab_06_inference"
