[project]
name = "lab-08-sdk-typescript"
version = "0.1.0"
description = "Server em TypeScript, com client em Python: schema, isError, cancelamento e paginação"
requires-python = ">=3.14"
dependencies = ["labs-common"]

[tool.uv.sources]
labs-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab_08_ts"
