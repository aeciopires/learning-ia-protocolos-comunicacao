# Lab 08: server em TypeScript e client em Python. O Node.js fica só dentro do container.
include:
  - ../observability/compose.yaml

services:
  server:
    image: lab-08-sdk-typescript-server:local
    build:
      context: ./server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: lab-08-server
      OTEL_RESOURCE_ATTRIBUTES: lab.id=${LAB_ID:-lab}
    ports:
      - "127.0.0.1:${LAB_SERVICE_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  scenario:
    extends:
      file: ../service-base.yaml
      service: python-service
    profiles: [scenario]
    image: lab-08-sdk-typescript:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-08-sdk-typescript
    command: ["python", "-m", "lab_08_ts.scenario"]
    depends_on:
      server:
        condition: service_healthy

  postgres:
    extends:
      file: ../postgres-base.yaml
      service: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
