[project]
name = "lab-05-primitivos"
version = "0.1.0"
description = "Resources, tools e prompts no cenário de pedidos"
requires-python = ">=3.14"
dependencies = ["labs-common"]

[tool.uv.sources]
labs-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
