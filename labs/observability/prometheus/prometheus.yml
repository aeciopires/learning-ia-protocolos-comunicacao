global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    # Intervalo curto: um exemplar só fica exposto até a próxima exportação do serviço, a cada 5 s.
    scrape_interval: 2s
    # O OpenMetrics vem primeiro porque só ele transporta exemplars.
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["otel-collector:8889"]
