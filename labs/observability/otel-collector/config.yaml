# Recebe os três sinais por OTLP e entrega cada um ao seu destino.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_http/loki:
    # O Loki recebe logs nativamente por OTLP e guarda trace_id como structured metadata.
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    # OpenMetrics é o formato que carrega exemplars até o Prometheus.
    enable_open_metrics: true
    # Copia atributos do recurso para rótulos: é o que permite filtrar por service_name.
    resource_constant_labels:
      included: ["service.name", "lab.id"]

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
