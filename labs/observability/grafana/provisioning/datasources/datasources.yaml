# UIDs fixos: dashboards e links de correlação dependem deles.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      # Métrica para trace: o exemplar leva ao trace que gerou aquele ponto.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
      # Trace para logs: abre no Loki as linhas do mesmo trace, em todos os serviços.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__span.traceId}"'
      # Trace para métricas: abre a taxa de operações do serviço do span.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: Operações por segundo
            query: sum(rate(lab_operations_total{$$__tags}[1m])) by (operation, outcome)

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Log para trace: o trace_id chega como structured metadata, por isso o tipo é label.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: jaeger
          urlDisplayLabel: Abrir trace no Jaeger
