; Recursos do Grafana 13.3. A variável GF_FEATURE_TOGGLES_ENABLE está deprecated.
[feature_toggles]
grafana.visualDesignRefresh = true
dashboard.notebooks = true
grafana.dashboardGlobalVariables = true
grafana.newTextPanel = true
text.newFeatures = true
grafana.dynamicTraceToLogs = true
; Necessário a partir do Jaeger 2.21, que removeu os endpoints HTTP antigos do datasource.
jaegerEnableGrpcEndpoint = true
