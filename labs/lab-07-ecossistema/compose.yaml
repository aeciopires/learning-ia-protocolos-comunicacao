# Lab 07: Fanout entre servers, descoberta e eras do protocolo.
include:
  - ../observability/compose.yaml

services:
  catalog:
    extends:
      file: ../service-base.yaml
      service: python-service
    image: lab-07-ecossistema:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-07-ecossistema
    command: ["python", "-m", "lab_07_ecosystem.catalog_server"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make secret}
    ports:
      # Publicado em 127.0.0.1 para uso com o MCP Inspector no host.
      - "127.0.0.1:${LAB_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "labs_common.healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  tickets:
    extends:
      file: ../service-base.yaml
      service: python-service
    image: lab-07-ecossistema:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-07-ecossistema
    command: ["python", "-m", "lab_07_ecosystem.tickets_server"]
    healthcheck:
      test: ["CMD", "python", "-m", "labs_common.healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started

  scenario:
    extends:
      file: ../service-base.yaml
      service: python-service
    profiles: [scenario]
    image: lab-07-ecossistema:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-07-ecossistema
    command: ["python", "-m", "lab_07_ecosystem.scenario"]
    depends_on:
      catalog:
        condition: service_healthy
      tickets:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    extends:
      file: ../postgres-base.yaml
      service: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
