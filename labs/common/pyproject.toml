[project]
name = "labs-common"
version = "0.1.0"
description = "Configuração, telemetria e utilitários compartilhados pelos laboratórios"
requires-python = ">=3.14"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-asgi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "labs_common"
