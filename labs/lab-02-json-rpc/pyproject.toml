[project]
name = "lab-02-json-rpc"
version = "0.1.0"
description = "Mensagens JSON-RPC brutas em stdio e HTTP"
requires-python = ">=3.14"
dependencies = ["labs-common"]

[tool.uv.sources]
labs-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab_02_json_rpc"
