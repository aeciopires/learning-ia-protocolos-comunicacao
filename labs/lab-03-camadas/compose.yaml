# Lab 03: A mesma capacidade por tool calling, MCP e A2A.
include:
  - ../observability/compose.yaml

services:
  server:
    extends:
      file: ../service-base.yaml
      service: python-service
    image: lab-03-camadas:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-03-camadas
    command: ["python", "-m", "lab_03_layers.mcp_server"]
    ports:
      # Publicado em 127.0.0.1 para uso com o MCP Inspector no host.
      - "127.0.0.1:${LAB_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "labs_common.healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started

  agent:
    extends:
      file: ../service-base.yaml
      service: python-service
    image: lab-03-camadas:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-03-camadas
    command: ["python", "-m", "lab_03_layers.agent"]
    healthcheck:
      test: ["CMD", "python", "-m", "labs_common.healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      server:
        condition: service_healthy
      otel-collector:
        condition: service_started

  scenario:
    extends:
      file: ../service-base.yaml
      service: python-service
    profiles: [scenario]
    image: lab-03-camadas:local
    build:
      context: ../..
      dockerfile: labs/python.Dockerfile
      args:
        LAB_PACKAGE: lab-03-camadas
    command: ["python", "-m", "lab_03_layers.scenario"]
    depends_on:
      server:
        condition: service_healthy
      agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
