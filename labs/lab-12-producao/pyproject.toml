[project]
name = "lab-12-producao"
version = "0.1.0"
description = "Imagem endurecida, borda, allowlist, 429, DNS rebinding e caos controlado"
requires-python = ">=3.14"
dependencies = ["labs-common"]

[tool.uv.sources]
labs-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab_12_production"
