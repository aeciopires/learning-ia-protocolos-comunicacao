# Base do PostgreSQL dos labs, usada com `extends`. A senha vem do .env, sem valor padrão.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make secret}
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20
